name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 python3-psutil \
            python3-requests python3-pil desktop-file-utils appstream \
            squashfs-tools
      - name: Byte-compile
        run: python3 -m compileall -q appdeb
      - name: Compile translations
        run: python3 scripts/build_mo.py --check
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate desktop entry
        run: desktop-file-validate data/io.github.ta4anx.AppDeb.desktop
      - name: Validate metainfo
        run: appstreamcli validate --no-net data/io.github.ta4anx.AppDeb.metainfo.xml
      - name: CLI smoke
        run: |
          python3 -m appdeb --version
          python3 -m appdeb managers
      - name: Shell syntax
        run: bash -n scripts/build_deb.sh
