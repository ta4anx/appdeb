name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 python3-psutil \
            python3-requests python3-pil desktop-file-utils appstream
      - name: Build .deb
        run: bash scripts/build_deb.sh
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.deb
            build/*.sha256
          generate_release_notes: true
