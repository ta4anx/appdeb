[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "appdeb"
version = "0.4.0"
description = "Full-control Flatpak, AppImage, .deb and .tar.gz application manager for Debian-based Linux"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Kaan Çakmak", email = "skaancakmak@gmail.com" }]
keywords = ["flatpak", "appimage", "deb", "package-manager", "gtk4", "libadwaita"]
classifiers = [
  "Environment :: X11 Applications :: GTK",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Software Distribution",
]
dependencies = [
  "PyGObject>=3.44",
  "psutil>=5.9",
  "requests>=2.28",
  "Pillow>=9.0",
]

[project.urls]
Homepage = "https://github.com/ta4anx/appdeb"
Issues = "https://github.com/ta4anx/appdeb/issues"

[tool.setuptools]
packages = ["appdeb", "appdeb.backends", "appdeb.services", "appdeb.ui"]

[tool.setuptools.package-data]
appdeb = ["data/*"]
